name: GiftLink CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./giftlink-backend
        run: npm install

      - name: Verify backend syntax
        working-directory: ./giftlink-backend
        run: |
          node --check app.js
          node --check models/db.js
          node --check routes/giftRoutes.js
          node --check routes/searchRoutes.js
          node --check routes/authRoutes.js
          echo "All backend files passed syntax check"

      - name: Install sentiment service dependencies
        working-directory: ./sentiment
        run: npm install

      - name: Verify sentiment service syntax
        working-directory: ./sentiment
        run: |
          node --check index.js
          echo "Sentiment service passed syntax check"

      - name: Verify seed data contains 16 gifts
        working-directory: ./giftlink-backend
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('util/import-mongo/gifts.json')).docs.length)")
          echo "Gift count: $COUNT"
          if [ "$COUNT" -ne 16 ]; then
            echo "Expected 16 gifts, found $COUNT"
            exit 1
          fi
          echo "Seed data verified"

      - name: Build summary
        run: echo "CI/CD pipeline completed successfully"
